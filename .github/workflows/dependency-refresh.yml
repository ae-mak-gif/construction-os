name: Temporary dependency lock refresh
# PR-only temporary lockfile audit job

on:
  pull_request:
    branches:
      - fix/auth-profile-schema-alignment

permissions:
  contents: read

jobs:
  refresh-lockfile:
    if: github.event.pull_request.number == 3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false

      - name: Apply compatible security updates to lockfile
        run: npm audit fix --package-lock-only

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error
