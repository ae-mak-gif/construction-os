name: One-time ESLint 10 lockfile refresh

on:
  push:
    branches:
      - fix/auth-client-access-stabilisation
    paths:
      - .github/workflows/refresh-eslint-lockfile.yml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false

      - name: Regenerate lockfile and verify
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npm audit --audit-level=low

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): upgrade ESLint 10 lockfile"
          git push origin HEAD:fix/auth-client-access-stabilisation
