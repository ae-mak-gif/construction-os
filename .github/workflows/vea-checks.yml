name: Build and VEA checks

on:
  push:
    branches:
      - feature/buildflow-vea-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check application
        run: npm run typecheck
      - name: Build application
        run: npm run build

  routing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test deterministic VEA routing and context boundaries
        run: deno test supabase/functions/vea-chat/vea-routing_test.ts
