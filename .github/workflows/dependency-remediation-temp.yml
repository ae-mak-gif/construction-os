name: BuildFlow Dependency Remediation (temporary)

on:
  push:
    branches:
      - fix/auth-profile-schema-alignment

permissions:
  contents: write

concurrency:
  group: dependency-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking security updates
        run: npm audit fix

      - name: Report remaining high-severity advisories
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Verify lint, TypeScript and production build
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Commit reviewed lockfile updates
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency file changes to commit."
            exit 0
          fi
          git commit -m "Fix vulnerable transitive dependencies"
          cat > "$RUNNER_TEMP/askpass.sh" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s' "x-access-token" ;;
            *Password*) printf '%s' "$GITHUB_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/askpass.sh"
          GIT_ASKPASS="$RUNNER_TEMP/askpass.sh" GIT_TERMINAL_PROMPT=0 git push origin "HEAD:$GITHUB_REF_NAME"
